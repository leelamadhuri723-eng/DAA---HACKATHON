<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Overview</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div class="preview-shell">
      <div class="preview-card">
        <div class="preview-header">
          <h1>Network Overview</h1>
          <span class="badge">Preview in progress</span>
        </div>
        <div class="grid">
          <div class="panel">
            <h2>Server graph</h2>
            <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
              <span class="node critical"></span> Critical server
              <span class="node safe"></span> Safe server
            </div>
            <div style="height:200px; border:1px solid var(--color-border); border-radius:10px; background:linear-gradient(135deg, #eef4ff, #f8fbff); position:relative; overflow:hidden;">
              <div style="position:absolute; left:15%; top:30%; width:60px; height:60px; border-radius:50%; background:#1d4ed8; opacity:0.8;"></div>
              <div style="position:absolute; left:48%; top:18%; width:54px; height:54px; border-radius:50%; background:#14b8a6; opacity:0.8;"></div>
              <div style="position:absolute; left:62%; top:58%; width:54px; height:54px; border-radius:50%; background:#d9534f; opacity:0.9;"></div>
              <div style="position:absolute; left:40%; top:64%; width:54px; height:54px; border-radius:50%; background:#8fb8de; opacity:0.8;"></div>
            </div>
          </div>
          <div class="panel">
            <h2>Critical servers</h2>
            <ul>
              <li>Gateway</li>
              <li>Router1</li>
            </ul>
          </div>
        </div>
        <div class="summary-row">
          <div class="metric"><strong>Servers</strong><br/>12</div>
          <div class="metric"><strong>Links</strong><br/>18</div>
          <div class="metric"><strong>Critical</strong><br/>2</div>
        </div>
      </div>
    </div>
  </body>
</html>
